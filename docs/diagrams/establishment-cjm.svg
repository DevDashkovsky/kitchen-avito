<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:475px;height:1502px;background:#FFFFFF;" width="475px" height="1502px" viewBox="0 0 475 1502" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="127.777" y="33.535" fill="#000" font-size="14" textLength="218.155" font-weight="700">CJM заведения в Авито.Кухне</text></g><ellipse cx="238.996" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="136.253" y="82.488" width="205.486" height="165.02" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M260.229,82.488 L260.229,91.977 L250.229,101.977 L136.253,101.977" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="139.253" y="97.023" fill="#000" font-size="14" textLength="113.976">1. Подключение</text><rect x="146.253" y="118.977" width="185.486" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="156.253" y="140.578" fill="#1F2937" font-size="12" textLength="165.486">Заведение получает доступ</text><text x="156.253" y="154.711" fill="#1F2937" font-size="12" textLength="85.365">к Авито.Кухне</text><rect x="147.208" y="187.242" width="183.576" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="157.208" y="208.844" fill="#1F2937" font-size="12" textLength="163.576">Проверяет, что интеграция</text><text x="157.208" y="222.977" fill="#1F2937" font-size="12" textLength="142.553">с платформой работает</text><rect x="124.291" y="257.508" width="229.41" height="233.285" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M277.572,257.508 L277.572,266.996 L267.572,276.996 L124.291,276.996" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="127.291" y="272.043" fill="#000" font-size="14" textLength="143.281">2. Управление меню</text><rect x="164.895" y="293.996" width="148.203" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="174.895" y="315.598" fill="#1F2937" font-size="12" textLength="128.203">Добавляет категории</text><text x="174.895" y="329.73" fill="#1F2937" font-size="12" textLength="98.883">и позиции меню</text><rect x="134.291" y="362.262" width="209.41" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="144.291" y="383.863" fill="#1F2937" font-size="12" textLength="189.41">Обновляет названия, описания,</text><text x="144.291" y="397.996" fill="#1F2937" font-size="12" textLength="156.111">цены и доступность блюд</text><rect x="154.195" y="430.527" width="169.602" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.195" y="452.129" fill="#1F2937" font-size="12" textLength="149.602">Управляет доступностью</text><text x="164.195" y="466.262" fill="#1F2937" font-size="12" textLength="134.631">приёма новых заказов</text><rect x="32.642" y="500.793" width="417.057" height="488.028" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M184.378,500.793 L184.378,510.281 L174.378,520.281 L32.642,520.281" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="35.642" y="515.328" fill="#000" font-size="14" textLength="141.736">3. Получение заказа</text><rect x="130.62" y="537.281" width="216.752" height="34.133" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="140.62" y="558.883" fill="#1F2937" font-size="12" textLength="196.752">Заведение получает новый заказ</text><polygon points="152.022,591.414,325.97,591.414,337.97,603.414,325.97,615.414,152.022,615.414,140.022,603.414,152.022,591.414" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="152.022" y="607.571" fill="#1F2937" font-size="11" textLength="173.948">Покупатель уже отменил заказ?</text><text x="126.557" y="601.094" fill="#000" font-size="11" textLength="13.465">да</text><text x="337.97" y="601.094" fill="#000" font-size="11" textLength="18.455">нет</text><rect x="52.642" y="625.414" width="154.76" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="62.642" y="647.016" fill="#1F2937" font-size="12" textLength="105.486">Заведение видит,</text><text x="62.642" y="661.148" fill="#1F2937" font-size="12" textLength="134.76">что заказ уже отменён</text><ellipse cx="130.022" cy="704.68" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="130.022" cy="704.68" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="264.25" y="625.414" width="167.439" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="274.25" y="647.016" fill="#1F2937" font-size="12" textLength="147.439">Проверяет состав заказа</text><text x="274.25" y="661.148" fill="#1F2937" font-size="12" textLength="114.896">и данные доставки</text><rect x="273.356" y="693.68" width="149.229" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="283.356" y="715.281" fill="#1F2937" font-size="12" textLength="123.445">Принимает решение</text><text x="283.356" y="729.414" fill="#1F2937" font-size="12" textLength="129.229">в течение двух минут</text><rect x="126.835" y="810.423" width="224.322" height="34.133" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="136.835" y="832.024" fill="#1F2937" font-size="12" textLength="204.322">Авито.Кухня завершает ожидание</text><rect x="141.627" y="864.556" width="194.738" height="48.266" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="151.627" y="886.157" fill="#1F2937" font-size="12" textLength="169.969">Заведение больше не может</text><text x="151.627" y="900.29" fill="#1F2937" font-size="12" textLength="174.738">принять или отклонить заказ</text><ellipse cx="238.996" cy="943.821" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="238.996" cy="943.821" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="161.964,761.945,316.028,761.945,328.028,773.945,316.028,785.945,161.964,785.945,149.964,773.945,161.964,761.945" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="242.996" y="796.58" fill="#000" font-size="11" textLength="18.455">нет</text><text x="161.964" y="778.103" fill="#1F2937" font-size="11" textLength="154.064">Заведение успело ответить?</text><text x="328.028" y="771.625" fill="#000" font-size="11" textLength="13.465">да</text><rect x="16" y="998.821" width="439.708" height="172.754" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M174.695,998.821 L174.695,1008.31 L164.695,1018.31 L16,1018.31" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="1013.356" fill="#000" font-size="14" textLength="148.695">4. Решение по заказу</text><polygon points="170.939,1035.31,307.053,1035.31,319.053,1047.31,307.053,1059.31,170.939,1059.31,158.939,1047.31,170.939,1035.31" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="170.939" y="1051.467" fill="#1F2937" font-size="11" textLength="136.114">Заказ можно выполнить?</text><text x="145.474" y="1044.989" fill="#000" font-size="11" textLength="13.465">да</text><text x="319.053" y="1044.989" fill="#000" font-size="11" textLength="18.455">нет</text><rect x="28" y="1069.31" width="207.143" height="34.133" fill="#ECF9EE" style="stroke:#3E7C45;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38" y="1090.911" fill="#1F2937" font-size="12" textLength="187.143">Заведение подтверждает заказ</text><rect x="255.143" y="1069.31" width="182.557" height="48.266" fill="#ECF9EE" style="s